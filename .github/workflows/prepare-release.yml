name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact release version (e.g. 0.19.0). Must match the unlocked train in .release-policy.json."
        required: true
        type: string
      branch:
        description: "Release branch (default release/v<version>)"
        required: false
        type: string
      title:
        description: "Release commit/PR title (default chore(release): v<version>)"
        required: false
        type: string
      confirmation:
        description: "Confirmation string. Must be exactly: RELEASE <version>"
        required: true
        type: string
        default: CANCEL

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.confirmation == format('RELEASE {0}', inputs.version) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: "${{ inputs.branch || format('release/v{0}', inputs.version) }}"
      RELEASE_TITLE: "${{ inputs.title || format('chore(release): v{0}', inputs.version) }}"
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Refuse stale, duplicate, or non-main preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch." >&2
            exit 1
          }
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "The selected main ref is stale. Re-run from the current main branch." >&2
            exit 1
          }
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          PACKAGE="@groeponline/pi-agent-orchestrator"
          # Exact version existence via shared helper — never the floating `latest` dist-tag.
          node scripts/release-recovery.mjs assert-absent "$PACKAGE" "$RELEASE_VERSION"

          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            OPEN_RELEASE_PRS="$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq 'length')"
            if [ "$OPEN_RELEASE_PRS" != "0" ]; then
              echo "Release branch $RELEASE_BRANCH already has an open PR; finish or close it before retrying." >&2
              exit 1
            fi
            echo "Removing stale release branch $RELEASE_BRANCH from an earlier failed preparation."
            git push origin --delete "$RELEASE_BRANCH"
          fi

      - name: Install dependencies
        run: |
          npm ci
          # npm may normalize dependency metadata in package-lock.json across npm versions.
          # Release preparation must start from the reviewed main lockfile exactly.
          git restore --source=HEAD -- package-lock.json

      - name: Verify frozen release policy
        run: |
          npm run verify:release-policy
          node scripts/release-policy.mjs candidate "$RELEASE_VERSION"

      - name: Prepare source version, changelog, and promo metadata
        run: node scripts/prepare-release.mjs "$RELEASE_VERSION" "$(date -u +%F)"

      - name: Run complete release candidate gate
        run: |
          npm run verify:release-policy
          npm run build
          npm run typecheck
          npm run lint
          npm test
          npm run verify:package # includes Pi package contract gate
          npm --prefix showcase/remotion run promo:data:check
          npm pack --dry-run --json > npm-pack.json
          node scripts/verify-npm-pack.mjs npm-pack.json

      - name: Verify release diff is minimal
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' CHANGELOG.md package-lock.json package.json showcase/remotion/public/promo-data.json "docs/releases/v${RELEASE_VERSION}.md" | sort)"
          # Every changed file must be expected; prepare may leave files it
          # already finds in the repo (e.g. the release notes template) untouched.
          UNEXPECTED="$(comm -23 <(printf '%s\n' "$ACTUAL") <(printf '%s\n' "$EXPECTED"))"
          if [ -n "$UNEXPECTED" ]; then
            echo "Release preparation changed unexpected files:" >&2
            printf '%s\n' "$UNEXPECTED" >&2
            exit 1
          fi

      - name: Create and semantically verify release commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RELEASE_BRANCH"
          git add CHANGELOG.md package.json package-lock.json showcase/remotion/public/promo-data.json
          git commit -m "$RELEASE_TITLE"
          node scripts/verify-release-transaction.mjs HEAD^ HEAD "$RELEASE_VERSION"
          node scripts/verify-version-transition.mjs HEAD^ HEAD "$RELEASE_BRANCH"
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Open reviewed release PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-pr.md <<'EOF'
          ## Release transaction

          This PR was generated by the guarded **Prepare Release __RELEASE_VERSION__** workflow.

          - Updates `package.json` and both package-lock root versions to `__RELEASE_VERSION__`.
          - Synchronizes all package-lock root metadata from `package.json`.
          - Finalizes the v__RELEASE_VERSION__ changelog date and deterministic Remotion promo metadata.
          - Contains no runtime or workflow changes.
          - Publishing starts only after this PR is approved, fully green, and merged.
          - The publisher rejects every version outside the currently unlocked release policy.

          After merge, `.github/workflows/release.yml` validates the exact squash commit, publishes npm with provenance, creates `v__RELEASE_VERSION__` on that commit, and creates the matching GitHub Release.
          EOF
          sed -i "s/__RELEASE_VERSION__/$RELEASE_VERSION/g" release-pr.md
          PR_URL="$(gh pr create --base main --head "$RELEASE_BRANCH" --title "$RELEASE_TITLE" --body-file release-pr.md)"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR_URL" --add-reviewer SoulWayy || echo "Reviewer request could not be added automatically; branch protection still requires external approval."
          gh pr comment "$PR_URL" --body "@coderabbitai review" || echo "CodeRabbit review trigger was not accepted; external approval remains mandatory."

      - name: Dispatch required checks for the bot-created PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run linter.yml --ref "$RELEASE_BRANCH"

      - name: Enable auto-merge after checks and external approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --squash \
            --subject "$RELEASE_TITLE" \
            --body "Prepared by the guarded v$RELEASE_VERSION release workflow."
