name: Release tag artifacts

# Tag pushes cannot share release.yml. GitHub skips a workflow whose push
# filter sets both branches and tags, because one event is never both.
# This workflow only attaches the reviewed tarball and SHA256SUMS. npm publish
# stays on the main-branch release workflow.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-tag-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release-from-tag:
    name: Attach immutable GitHub Release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Verify tag equals package version on origin/main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-tag.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build and pack release artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/build-stamp.json
          npm pack --ignore-scripts --json > release-pack.json
          node scripts/verify-npm-pack.mjs release-pack.json
          node scripts/write-release-manifest.mjs release-pack.json release-manifest.json
          TARBALL="$(node -p "require('./release-manifest.json').tarballFile")"
          sha256sum "$TARBALL" > SHA256SUMS
          echo "filename=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release with artifact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARBALL="${{ steps.pack.outputs.filename }}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${TARBALL}" SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${TAG}" \
              "${TARBALL}" \
              SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag
          fi
