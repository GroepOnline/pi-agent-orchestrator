name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality gate
    # PR → pr-isolated (no docker/secrets). Push to main → trusted-heavy.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Keep credentials off the working tree. Version-transition prefers the
          # PR base SHA already present from fetch-depth:0; any fallback fetch
          # uses the job token explicitly (bare `git fetch origin main` exits
          # 128 on transferred org remotes when auth is stripped).
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frozen release policy
        run: npm run verify:release-policy

      - name: Verify package version transition
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prefer PR base SHA (normally already local with fetch-depth: 0).
          # Do not use bare `git fetch origin main` — after org transfer that
          # prompts for HTTPS credentials and fails the Quality gate with 128
          # immediately after verify:release-policy.
          if [ -n "${BASE_SHA:-}" ]; then
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                "${BASE_SHA}"
            fi
            node scripts/verify-version-transition.mjs "${BASE_SHA}" HEAD "$CURRENT_BRANCH"
          else
            git fetch --no-tags \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "+refs/heads/main:refs/remotes/origin/main"
            node scripts/verify-version-transition.mjs origin/main HEAD "$CURRENT_BRANCH"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee biome.log

      - name: Upload Biome diagnostics
        if: failure() && steps.lint.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: biome-diagnostics-${{ github.run_id }}
          path: biome.log
          retention-days: 14

      - name: Build
        run: npm run build

      - name: Verify Pi package metadata
        run: npm run verify:package

      - name: Test
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload quality test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-test-diagnostics-${{ github.run_id }}
          path: test.log
          retention-days: 14

      - name: Verify npm package contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > npm-pack.json
          node scripts/verify-npm-pack.mjs npm-pack.json

  compatibility:
    name: Compatibility (${{ matrix.label }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux (fleet)
            runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
            node: 24
          - label: windows-latest
            runs-on: windows-latest
            node: 22
          - label: windows-latest
            runs-on: windows-latest
            node: 24
          - label: macos-latest
            runs-on: macos-latest
            node: 22
          - label: macos-latest
            runs-on: macos-latest
            node: 24
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload compatibility test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.label }}-node-${{ matrix.node }}-${{ github.run_id }}
          path: test.log
          retention-days: 14

  lowest-peer-dependencies:
    name: Lowest supported peer dependencies
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19
          cache: npm

      - name: Install lowest supported peer dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false --include=dev \
            @earendil-works/pi-ai@0.81.1 \
            @earendil-works/pi-coding-agent@0.81.1
          npm ls @earendil-works/pi-ai @earendil-works/pi-coding-agent

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        id: tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Upload lowest-peer test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lowest-peer-test-diagnostics-${{ github.run_id }}
          path: test.log
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 10
    # GroepOnline transfer: Dependency graph / GHAS is often still off. Probe
    # first and skip the action when unsupported so the check is green (not a
    # red FAILURE that leaves the PR UNSTABLE). continue-on-error remains as a
    # belt-and-suspenders for race/transient GHAS gaps — same class as #1.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Dependency graph support
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dep-graph-probe.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}" || true)
          case "$code" in
            200)
              echo "supported=true" >> "$GITHUB_OUTPUT"
              echo "Dependency graph available (HTTP 200); running review."
              ;;
            *)
              echo "supported=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Dependency graph/GHAS unavailable (HTTP ${code:-curl-failed}); skipping dependency-review-action for org cutover."
              ;;
          esac

      - name: Review dependency changes
        if: steps.depgraph.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  benchmarks:
    name: Render benchmarks
    needs: quality
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks and evaluate thresholds
        run: node scripts/check-benchmark-thresholds.mjs

  required-gate:
    name: Required CI gate
    # Run whenever the workflow itself was not cancelled. Using always() here
    # makes the gate FAIL when a run is superseded via concurrency (upstream
    # jobs report "cancelled"), leaving a spurious "Required CI gate" failure on
    # every cancelled run and stalling auto-merge. !cancelled() still runs the
    # gate on genuine upstream failures so real regressions are caught, but
    # skips it when the run was cancelled.
    if: ${{ !cancelled() }}
    needs:
      - quality
      - compatibility
      - lowest-peer-dependencies
      - dependency-review
      - benchmarks
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          LOWEST_PEER_RESULT: ${{ needs.lowest-peer-dependencies.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          BENCHMARKS_RESULT: ${{ needs.benchmarks.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$LOWEST_PEER_RESULT" = "success"
          # Allow failure while Dependency graph / GHAS is still off after org transfer.
          test "$DEPENDENCY_REVIEW_RESULT" = "success" -o "$DEPENDENCY_REVIEW_RESULT" = "skipped" -o "$DEPENDENCY_REVIEW_RESULT" = "failure"
          test "$BENCHMARKS_RESULT" = "success"

  notify-on-failure:
    name: Notify Linear on CI failure
    if: failure() && github.event_name != 'merge_group'
    needs:
      - quality
      - compatibility
      - lowest-peer-dependencies
      - dependency-review
      - benchmarks
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 5
    steps:
      - name: Create Linear issue
        uses: actions/github-script@v7
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY_CI }}
        with:
          script: |
            const title = `CI Failure: ${{ github.workflow }} in pi-agent-orchestrator`;
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const desc = [
              `Workflow **${{ github.workflow }}** failed in [pi-agent-orchestrator](`https://github.com/${{ github.repository }}`)`,
              ``,
              `**Run:** ${runUrl}`,
              `**Branch:** ${{ github.head_ref || github.ref_name }}`,
              `**SHA:** ${{ github.sha.substring(0,7) }}`,
              ``,
              `Created automatically by CI failure tracker.`,
            ].join('\n');
            const query = `
              mutation {
                issueCreate(input: {
                  title: "${title.replace(/"/g, '\\"')}",
                  description: "${desc.replace(/"/g, '\\"').replace(/\\n/g, '\\n')}",
                  teamId: "bbd2b9e0-e644-4717-9074-8d0eaa3f150a",
                  priority: 2,
                  labelIds: ["713eee90-d169-40a6-98b8-7c71502b9855", "73cc7952-aca3-48f9-8bbd-1193c20fdfe2"]
                }) {
                  issue { id identifier }
                }
              }
            `;
            const res = await fetch('https://api.linear.app/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': process.env.LINEAR_API_KEY },
              body: JSON.stringify({ query })
            });
            const data = await res.json();
            if (data.data?.issueCreate?.issue) {
              console.log(`Created Linear issue: ${data.data.issueCreate.issue.identifier}`);
            }
