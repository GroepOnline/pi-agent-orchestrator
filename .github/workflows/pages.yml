---
# Publish the project landing page to the GitHub Pages mirror.
# Target URL: https://groeponline.github.io/pi-agent-orchestrator/
#
# scripts/build-site.sh uses SITE_BASE to produce a self-contained artifact for
# the /pi-agent-orchestrator/ subpath, including the explicit agent-discovery
# files staged by site/web/scripts/stage-public.mjs.
#
# This is the sole workflow that deploys to GitHub Pages.
#
# One-time repo setup (cannot be done with GITHUB_TOKEN):
#   gh api -X POST repos/OWNER/REPO/pages \
#     -f build_type=workflow -f 'source[branch]=main' -f 'source[path]=/'
# After that, configure-pages only reads site metadata; it does not need
# enablement (which requires a PAT/App with administration:write).
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.sh'
      - 'sitemap.xml'
      - 'sitemap.md'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AGENTS.md'
      - 'agent-permissions.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: { }

# Allow only one concurrent Pages deployment; do not cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Production publish is main-only (matches Cloudflare Pages deploy guard).
    # workflow_dispatch on other refs must not stage/enable production Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble publish directory
        env:
          SITE_BASE: /pi-agent-orchestrator/
        run: bash scripts/build-site.sh _site
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
