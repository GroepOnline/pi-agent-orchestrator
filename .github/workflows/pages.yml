---
# Publish the project landing page to the GitHub Pages mirror.
# Target URL: https://groeponline.github.io/pi-agent-orchestrator/
#
# scripts/build-site.sh uses SITE_BASE to produce a self-contained artifact for
# the /pi-agent-orchestrator/ subpath, including the explicit agent-discovery
# files staged by site/web/scripts/stage-public.mjs.
#
# This is the sole workflow that deploys to GitHub Pages. Use GitHub-hosted
# runners: deploy-pages OIDC is unreliable on the fleet, and a hung fleet
# job in this concurrency group blocks later catalog-video publishes.
#
# Pages is workflow-backed (enabled 2026-08-18). Re-enable if has_pages is false:
#   gh api -X POST repos/OWNER/REPO/pages \
#     --input - <<< '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.sh'
      - 'sitemap.xml'
      - 'sitemap.md'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AGENTS.md'
      - 'agent-permissions.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Deny by default; each job grants only what it needs.
permissions: { }

# Allow only one concurrent Pages deployment; do not cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Production publish is main-only (matches Cloudflare Pages deploy guard).
    # workflow_dispatch on other refs must not stage/enable production Pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19
          package-manager-cache: false
      - name: Assemble publish directory
        env:
          SITE_BASE: /pi-agent-orchestrator/
        run: bash scripts/build-site.sh _site
      - name: Confirm catalog video is staged
        run: |
          set -euo pipefail
          for file in dashboard_preview.mp4 product_film.mp4 dashboard_preview.gif; do
            path="_site/assets/${file}"
            test -s "$path"
            size="$(wc -c < "$path")"
            test "$size" -gt 100000
            echo "${file}: ${size} bytes"
          done
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
