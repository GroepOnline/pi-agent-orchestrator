---
name: Deploy Cloudflare Pages

# Deploy immediately for production-site changes, with a daily reconciliation
# run and manual fallback.
# Required environment secrets (GitHub Environment `cloudflare-pages`):
#   CLOUDFLARE_API_TOKEN  — Account API token with Cloudflare Pages:Edit + Deploy
#   CLOUDFLARE_ACCOUNT_ID
# If deploy fails with Authentication error [code: 10000] / Invalid access token
# [code: 9109], rotate the token; discovery files (llms.txt) will not go live
# until this job succeeds (SPA fallback otherwise serves HTML for /llms.txt).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'scripts/build-site.sh'
      - 'sitemap.xml'
      - 'sitemap.md'
      - 'robots.txt'
      - 'llms.txt'
      - 'llms-full.txt'
      - 'AGENTS.md'
      - 'agent-permissions.json'
      - '.github/workflows/cloudflare-pages.yml'
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    environment:
      name: cloudflare-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Assemble static site
        run: bash scripts/build-site.sh _site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=pi-agent-orchestrator
            --branch=main
