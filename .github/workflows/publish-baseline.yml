name: Publish maintenance baseline

# Publishes an approved pre-train baseline already landed on main (e.g. 0.17.5,
# 0.17.6). The version is validated against .release-policy.json#sourceBaselines
# and must equal the package.json version currently on main. The locked 0.18
# transactional publisher remains separate — see release.yml.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the exact baseline version to publish (must match package.json on main and be in sourceBaselines)"
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-baseline-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build baseline artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate confirm version format
        env:
          CONFIRM_VERSION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          # Validate the whole CONFIRM_VERSION value as a single scalar. Piping to
          # grep matches per line, so a multi-line value like "0.17.6\nextra text"
          # would slip a valid version through on its own line. Reject any CR/LF
          # first, then anchor strict semver against the entire string. The value
          # arrives via the env block (never interpolated into this script), so the
          # quoted expansion below is not a shell-injection surface.
          case "$CONFIRM_VERSION" in
            *[$'\r\n']*)
              echo "::error::Confirm version must be a single line (no CR/LF)." >&2
              exit 1
              ;;
          esac
          if [[ ! "$CONFIRM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Confirm version must be strict semver (X.Y.Z)." >&2
            exit 1
          fi

      - name: Resolve baseline version
        id: version
        env:
          CONFIRM_VERSION: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if ! printenv CONFIRM_VERSION | grep -Fxq "$VERSION"; then
            echo "::error::Requested baseline does not match package.json version '$VERSION' on main." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19
          package-manager-cache: false

      - name: Validate maintenance baseline policy
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-policy.mjs baseline "$VERSION"

      - run: npm ci

      - name: Run release gate
        run: |
          npm run build
          npm run typecheck
          npm run lint
          npm test
          npm run verify:package

      - name: Pack immutable artifact
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > release-pack.json
          node scripts/verify-npm-pack.mjs release-pack.json
          node scripts/write-release-manifest.mjs release-pack.json release-manifest.json
          echo "filename=$(node -p "require('./release-manifest.json').tarballFile")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-baseline-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.pack.outputs.filename }}
            release-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish baseline to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release-recovery.mjs
            scripts/verify-published-package.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-baseline-${{ needs.verify.outputs.version }}
          path: release-artifact

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Decide whether npm publish is required
        id: npm
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-recovery.mjs decide-publish "@onlinechefgroep/pi-agent-orchestrator" "$RELEASE_VERSION"

      - name: Publish tarball with provenance
        if: steps.npm.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(node -p "require('./release-artifact/release-manifest.json').tarballFile")"
          npm publish "./release-artifact/${TARBALL}" --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-published-package.mjs \
            --spec "@onlinechefgroep/pi-agent-orchestrator@$RELEASE_VERSION" \
            --expected release-artifact/release-manifest.json \
            --workdir published

  finalize:
    name: Tag and create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create or verify Git tag
        run: node scripts/ensure-release-tag.mjs "v$RELEASE_VERSION" "$GITHUB_SHA"

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-recovery.mjs ensure-github-release "v$RELEASE_VERSION" "v$RELEASE_VERSION"

      - name: Summary
        run: |
          {
            echo "## Published maintenance baseline v$RELEASE_VERSION"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- npm: \`@onlinechefgroep/pi-agent-orchestrator@$RELEASE_VERSION\`"
            echo "- 0.18.x transactional train remains locked."
          } >> "$GITHUB_STEP_SUMMARY"
