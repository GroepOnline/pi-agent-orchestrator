<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">Pi Agent Orchestrator execution flow</title><desc id="desc">Operator request enters the dispatcher, selects single, crew, swarm, or auto strategy, runs inside inherited execution boundaries, and returns structured handoff state to the live agents control surface.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
<rect width="1600" height="820" rx="24" fill="#0b1020"/><rect x="1" y="1" width="1598" height="818" rx="23" fill="none" stroke="#273449" stroke-width="2"/>
<text x="64" y="74" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="700">Pi Agent Orchestrator execution flow</text>
<text x="64" y="110" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18">One dispatcher, four strategies, explicit execution boundaries.</text>
<rect x="64" y="156" width="230" height="112" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/><text x="88" y="192" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">REQUEST</text><text x="88" y="226" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="23" font-weight="700">Operator / workflow</text><text x="88" y="252" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Prompt · schedule · template</text>
<line x1="294" y1="212" x2="350" y2="212" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="366" y="140" width="300" height="144" rx="18" fill="#121b30" stroke="#475569" stroke-width="2"/><text x="394" y="180" fill="#a78bfa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">DISPATCHER</text><text x="394" y="217" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="25" font-weight="700">Choose execution mode</text><text x="394" y="249" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16">Default is single. Multi-agent is opt-in.</text>
<line x1="666" y1="212" x2="724" y2="212" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="742" y="136" width="190" height="154" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/><text x="766" y="172" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">SINGLE</text><text x="766" y="208" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">1 bounded agent</text><text x="766" y="239" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Simple, sequential</text><text x="766" y="264" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Default mode</text>
<rect x="950" y="136" width="190" height="154" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/><text x="974" y="172" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">CREW</text><text x="974" y="208" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Role-based team</text><text x="974" y="239" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Defined workers</text><text x="974" y="264" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Structured handoffs</text>
<rect x="1158" y="136" width="190" height="154" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/><text x="1182" y="172" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">SWARM</text><text x="1182" y="208" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Parallel workers</text><text x="1182" y="239" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Fan out</text><text x="1182" y="264" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Then synthesize</text>
<rect x="1366" y="136" width="170" height="154" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/><text x="1390" y="172" fill="#a78bfa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">AUTO</text><text x="1390" y="208" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="700">Select strategy</text><text x="1390" y="239" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Task-aware</text><text x="1390" y="264" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Still bounded</text>
<line x1="837" y1="290" x2="837" y2="346" stroke="#64748b" stroke-width="2.5"/><line x1="1045" y1="290" x2="1045" y2="346" stroke="#64748b" stroke-width="2.5"/><line x1="1253" y1="290" x2="1253" y2="346" stroke="#64748b" stroke-width="2.5"/><line x1="1451" y1="290" x2="1451" y2="346" stroke="#64748b" stroke-width="2.5"/><line x1="837" y1="346" x2="1451" y2="346" stroke="#64748b" stroke-width="2.5"/><line x1="1144" y1="346" x2="1144" y2="392" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="390" width="1472" height="154" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/><text x="92" y="430" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">EXECUTION BOUNDARY</text><text x="92" y="468" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">Every child inherits a narrower envelope</text>
<rect x="92" y="492" width="286" height="34" rx="9" fill="#111827" stroke="#334155"/><text x="235" y="514" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">tools + permissions</text>
<rect x="394" y="492" width="286" height="34" rx="9" fill="#111827" stroke="#334155"/><text x="537" y="514" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">depth + turn limits</text>
<rect x="696" y="492" width="286" height="34" rx="9" fill="#111827" stroke="#334155"/><text x="839" y="514" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">token + cost budgets</text>
<rect x="998" y="492" width="286" height="34" rx="9" fill="#111827" stroke="#334155"/><text x="1141" y="514" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">scope + partitions</text>
<rect x="1300" y="492" width="208" height="34" rx="9" fill="#111827" stroke="#334155"/><text x="1404" y="514" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">worktree isolation</text>
<line x1="800" y1="544" x2="800" y2="594" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="606" width="694" height="142" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/><text x="92" y="646" fill="#a78bfa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">HANDOFF</text><text x="92" y="684" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">Structured result + evidence</text><text x="92" y="716" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">files · branches · URLs · notes · conclusions</text>
<line x1="758" y1="677" x2="824" y2="677" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="840" y="606" width="696" height="142" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/><text x="868" y="646" fill="#67e8f9" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700">LIVE CONTROL</text><text x="868" y="684" fill="#f8fafc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">/agents operator surface</text><text x="868" y="716" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">observe · inspect · steer · terminate · queue · resources</text>
<text x="800" y="790" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Orchestration does not imply merge, publish or deploy.</text></svg>
