<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent Orchestrator execution flow</title>
  <desc id="desc">Diagram showing operator input entering orchestration dispatch, bounded Explore, Plan, Analysis and implementation agents, then structured handoffs and the live agents dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="758" rx="27" fill="none" stroke="#263247"/>

  <text x="70" y="78" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700">PI AGENT ORCHESTRATOR</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">Observable multi-agent execution inside Pi · v0.19.1</text>
  <rect x="1164" y="58" width="166" height="42" rx="21" fill="#172033" stroke="#334155"/>
  <text x="1247" y="85" fill="#cbd5e1" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">LOCAL CONTROL PLANE</text>

  <g filter="url(#shadow)">
    <rect x="70" y="184" width="220" height="122" rx="18" fill="#111c31" stroke="#334155"/>
    <text x="94" y="220" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">REQUEST</text>
    <text x="94" y="254" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="650">Operator / workflow</text>
    <text x="94" y="284" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Pi prompt, schedule or template</text>

    <rect x="350" y="168" width="300" height="154" rx="20" fill="#142038" stroke="#475569"/>
    <text x="378" y="207" fill="#a78bfa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">DISPATCH</text>
    <text x="378" y="243" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Orchestration strategy</text>
    <text x="378" y="274" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">single · crew · swarm · auto</text>
    <text x="378" y="299" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Default: single · multi-agent is opt-in</text>

    <rect x="710" y="148" width="620" height="194" rx="22" fill="#0f1a2d" stroke="#334155"/>
    <text x="740" y="187" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">BOUNDED AGENTS</text>

    <rect x="740" y="211" width="126" height="88" rx="14" fill="#16253a" stroke="#2d4c63"/>
    <text x="803" y="245" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Explore</text>
    <text x="803" y="272" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">read-only</text>

    <rect x="884" y="211" width="126" height="88" rx="14" fill="#16253a" stroke="#2d4c63"/>
    <text x="947" y="245" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Plan</text>
    <text x="947" y="272" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">read-only</text>

    <rect x="1028" y="211" width="126" height="88" rx="14" fill="#16253a" stroke="#4c3f73"/>
    <text x="1091" y="245" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Analysis</text>
    <text x="1091" y="272" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">optional ctx_*</text>

    <rect x="1172" y="211" width="128" height="88" rx="14" fill="#16253a" stroke="#4c3f73"/>
    <text x="1236" y="245" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Implement</text>
    <text x="1236" y="272" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">bounded tools</text>
  </g>

  <line x1="290" y1="245" x2="338" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="245" x2="698" y2="245" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="394" width="430" height="214" rx="22" fill="#101b2f" stroke="#334155"/>
    <text x="100" y="435" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">EXECUTION BOUNDARY</text>
    <text x="100" y="474" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Restrictions narrow downward</text>

    <circle cx="112" cy="516" r="5" fill="#67e8f9"/>
    <text x="132" y="522" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Inherited parent permissions</text>
    <circle cx="112" cy="552" r="5" fill="#67e8f9"/>
    <text x="132" y="558" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Budgets · depth · turn limits</text>
    <circle cx="112" cy="588" r="5" fill="#67e8f9"/>
    <text x="132" y="594" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Optional git worktree isolation</text>

    <rect x="548" y="394" width="352" height="214" rx="22" fill="#101b2f" stroke="#334155"/>
    <text x="578" y="435" fill="#a78bfa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">HANDOFF</text>
    <text x="578" y="474" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Explicit transfer state</text>
    <text x="578" y="511" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Machine-readable conclusions + artifacts</text>
    <rect x="578" y="538" width="292" height="42" rx="10" fill="#17233a" stroke="#334155"/>
    <text x="724" y="565" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">file · branch · url · note</text>

    <rect x="948" y="394" width="382" height="214" rx="22" fill="#101b2f" stroke="#334155"/>
    <text x="978" y="435" fill="#67e8f9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">OPERATOR SURFACE</text>
    <text x="978" y="474" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700">Live `/agents` control</text>
    <text x="978" y="511" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Observe · steer · inspect · terminate</text>
    <text x="978" y="542" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Agents · queue · resources · schedules</text>
    <text x="978" y="570" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">Health · performance · lifecycle state</text>
  </g>

  <path d="M1020 342 C1020 365, 710 360, 710 382" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="501" x2="536" y2="501" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="501" x2="936" y2="501" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="659" width="1260" height="44" rx="13" fill="#0d1728" stroke="#253247"/>
  <rect x="70" y="659" width="7" height="44" rx="3" fill="url(#accent)"/>
  <text x="96" y="687" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">No hosted control plane required · optional telemetry stays inert until explicitly configured · merge/publish/deploy are never implied by orchestration alone</text>
</svg>
